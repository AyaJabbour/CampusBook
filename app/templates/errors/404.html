{% extends "base.html" %}

{% block title %}Page Introuvable (404) — CampusBook{% endblock %}

{% block content %}
<div class="container py-5 text-center">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="card p-5 border-0 shadow-sm">
                <div class="display-1 fw-bold text-primary mb-2">404</div>
                <h3 class="fw-bold mb-3">Page ou Ressource Introuvable</h3>
                <p class="text-muted mb-4">
                    La salle ou la page que vous recherchez n'existe pas ou a été déplacée.
                </p>
                <div>
                    <a href="{{ url_for('rooms.index') }}" class="btn btn-accent px-4 py-2 fw-semibold">
                        <i class="bi bi-door-open me-1"></i> Explorer les salles disponibles
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
